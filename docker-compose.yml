name: gochat

services:
  mysql:
    image: mysql:8.0
    container_name: gochat-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: gochat
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ${GOCHAT_MYSQL_DATA:-gochat_mysql-data}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: gochat-redis
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      # 6381:6379 —— 避开 mesguard 等其他项目占用的 6379/6380，GoChat 独占 6381
      - "6381:6379"
    volumes:
      - ${GOCHAT_REDIS_DATA:-gochat_redis-data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gochat-backend
    environment:
      APP_ENV: docker
      TZ: Asia/Shanghai
      # 阿里云短信配置通过 .env 注入（GOCHAT_SMS_*），容器内若为空则走开发模式
      # （验证码写 Redis + 服务端日志打印），保证未配置时 demo 也能走通注册/短信登录。
      GOCHAT_SMS_ACCESS_KEY_ID: ${GOCHAT_SMS_ACCESS_KEY_ID:-}
      GOCHAT_SMS_ACCESS_KEY_SECRET: ${GOCHAT_SMS_ACCESS_KEY_SECRET:-}
      GOCHAT_SMS_SIGN_NAME: ${GOCHAT_SMS_SIGN_NAME:-}
      GOCHAT_SMS_TEMPLATE_CODE: ${GOCHAT_SMS_TEMPLATE_CODE:-}
      GOCHAT_SMS_SCHEME_NAME: ${GOCHAT_SMS_SCHEME_NAME:-}
      GOCHAT_SMS_COUNTRY_CODE: ${GOCHAT_SMS_COUNTRY_CODE:-86}
      GOCHAT_SMS_CODE_LENGTH: ${GOCHAT_SMS_CODE_LENGTH:-6}
      GOCHAT_SMS_VALID_TIME: ${GOCHAT_SMS_VALID_TIME:-300}
      GOCHAT_SMS_DUPLICATE_POLICY: ${GOCHAT_SMS_DUPLICATE_POLICY:-1}
      GOCHAT_SMS_INTERVAL: ${GOCHAT_SMS_INTERVAL:-60}
      GOCHAT_SMS_CODE_TYPE: ${GOCHAT_SMS_CODE_TYPE:-1}
      GOCHAT_SMS_CASE_AUTH_POLICY: ${GOCHAT_SMS_CASE_AUTH_POLICY:-1}
      GOCHAT_SMS_RETURN_VERIFY_CODE: ${GOCHAT_SMS_RETURN_VERIFY_CODE:-false}
      GOCHAT_SMS_AUTO_RETRY: ${GOCHAT_SMS_AUTO_RETRY:-1}
      # 演示默认开发模式验证码（即使 AK 已配置也走本地验证码，日志打印）；
      # 需要真实短信时在 .env 置 GOCHAT_SMS_DEV_MODE=false 并配置 AK。
      GOCHAT_SMS_DEV_MODE: ${GOCHAT_SMS_DEV_MODE:-true}
      # JWT 密钥：生产必须通过 GOCHAT_JWT_SECRET 注入强密钥
      GOCHAT_JWT_SECRET: ${GOCHAT_JWT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # docker 配置默认 messageMode=kafka，后端启动即建 topic/起消费组
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ${GOCHAT_BACKEND_LOGS:-gochat_backend-logs}:/app/logs
      - ${GOCHAT_BACKEND_AVATARS:-gochat_backend-avatars}:/app/static/avatars
      - ${GOCHAT_BACKEND_FILES:-gochat_backend-files}:/app/static/files
    healthcheck:
      # busybox wget 对 401 不写文件且返回非零，不能用作健康判据；
      # 直接探测 8000 端口（TCP 可达即说明 HTTP 网关在监听）
      test: ["CMD-SHELL", "nc -z localhost 8000"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build:
      context: ./web/chat-server
      dockerfile: Dockerfile
      # 不注入 API/WS 地址：由前端按页面 hostname 自动推导（store/index.js），
      # 这样局域网/手机通过 http://<服务器IP>:8080 访问时，API/WS 也会指向
      # 同一 IP 的 8000 端口，而不是写死 localhost。
      # 需要定制时显式设置 FRONTEND_API_BASE_URL / FRONTEND_WS_BASE_URL。
      args:
        VUE_APP_API_BASE_URL: ${FRONTEND_API_BASE_URL:-}
        VUE_APP_WS_BASE_URL: ${FRONTEND_WS_BASE_URL:-}
    container_name: gochat-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  kafka:
    image: apache/kafka:3.7.0
    container_name: gochat-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 双监听器：BROKER 供 compose 网络内后端访问(kafka:9092，广播地址必须是
      # 服务名，否则客户端拿到 localhost 元数据会连到自己)；EXTERNAL 供宿主机
      # 工具访问(localhost:29092)。宿主 9092 已被 mesguard-langfuse-minio 占用，
      # GoChat 独占 29092。
      KAFKA_LISTENERS: BROKER://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 拉取批次最大等待降到 50ms：Kafka 模式端到端延迟主要受此参数影响（默认 500ms）
      KAFKA_FETCH_MAX_WAIT_MS: 50
      KAFKA_FETCH_MIN_BYTES: 1
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  seed:
    image: mysql:8.0
    container_name: gochat-seed
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        until mysql -hmysql -uroot -p123456 gochat -e "SELECT 1 FROM user_info LIMIT 1" >/dev/null 2>&1;
        do echo "waiting for user_info table..."; sleep 2; done;
        mysql -hmysql -uroot -p123456 gochat -e "
        INSERT INTO user_info
        (uuid, nickname, telephone, email, avatar, password, birthday, signature, created_at, is_admin, status)
        SELECT t.uuid, t.nickname, t.telephone, t.email, t.avatar, t.password, t.birthday, t.signature, NOW(), t.is_admin, 0
        FROM (
          SELECT 'U10000000001' AS uuid, '陈默' AS nickname, '18387172912' AS telephone,
                 'chenmo1992@163.com' AS email, '' AS avatar,
                 '$$2a$$10$$xUbi9Nui5nWeyv1LvomV8.TIxtkoYHVP6PFFcSmiOplhFLg88IJge' AS password,
                 '19920318' AS birthday, '把系统做简单,把细节做扎实' AS signature, 1 AS is_admin
          UNION ALL
          SELECT 'U10000000002', '林晚晴', '15621173723', 'wanqing.l@vip.qq.com', '',
                 '$$2a$$10$$xUbi9Nui5nWeyv1LvomV8.TIxtkoYHVP6PFFcSmiOplhFLg88IJge',
                 '19950722', '像素眼,细节控', 0
        ) AS t
        WHERE NOT EXISTS (SELECT 1 FROM user_info WHERE telephone = t.telephone);
        "
    # 兜底账号(密码 123456,bcrypt):保证全新 volume 一键起来即可登录。
    # 完整演示数据(联系人/群聊/消息/头像)运行:go run ./cmd/seed --force

volumes:
  mysql-data:
  redis-data:
  backend-logs:
  backend-avatars:
  backend-files:
