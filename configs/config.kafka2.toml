# kafka 模式运行配置 - 实例2（双实例扩容测试用，仅端口不同）
# 用法：$env:CONFIG_FILE = "configs/config.kafka2.toml"; go run ./cmd/gochat

[serverConfig]
appName = "gochat"
host = "0.0.0.0"
port = 8001
tlsEnabled = false
sslRedirect = false
tlsCertFile = ""
tlsKeyFile = ""

[mysqlConfig]
host = "127.0.0.1"
port = 3306
user = "root"
password = "123456"
databaseName = "gochat"
network = "tcp"
socketPath = "/var/run/mysqld/mysqld.sock"

[redisConfig]
host = "127.0.0.1"
port = 6381
password = ""
db = 0
flushOnShutdown = false

[authCodeConfig]
accessKeyID = ""
accessKeySecret = ""
signName = ""
templateCode = ""
schemeName = ""
countryCode = "86"
codeLength = 6
validTime = 300
duplicatePolicy = 1
interval = 60
codeType = 1
caseAuthPolicy = 1
returnVerifyCode = false
autoRetry = 1

[logConfig]
logPath = "./logs/gochat2.log"

[kafkaConfig]
messageMode = "kafka"
hostPort = "127.0.0.1:9092"
loginTopic = "login"
chatTopic = "chat_message"
pushTopic = "chat_push"
logoutTopic = "logout"
partition = 3
timeout = 1
requiredAcks = "one"

[jwtConfig]
secret = "gochat-dev-secret-change-me"
accessTokenTTL = 15
refreshTokenTTL = 7

[staticSrcConfig]
staticAvatarPath = "./static/avatars"
staticFilePath = "./static/files"
