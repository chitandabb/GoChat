[serverConfig]
appName = "gochat"
host = "0.0.0.0"
port = 8000
tlsEnabled = false
sslRedirect = false
tlsCertFile = ""
tlsKeyFile = ""

[mysqlConfig]
host = "mysql"
port = 3306
user = "root"
password = "123456"
databaseName = "gochat"
network = "tcp"
socketPath = "/var/run/mysqld/mysqld.sock"

[redisConfig]
host = "redis"
port = 6379
password = ""
db = 0
flushOnShutdown = false

[authCodeConfig]
accessKeyID = ""
accessKeySecret = ""
signName = ""
templateCode = ""
schemeName = ""
countryCode = "86"
codeLength = 6
validTime = 300
duplicatePolicy = 1
interval = 60
codeType = 1
caseAuthPolicy = 1
returnVerifyCode = false
autoRetry = 1
# Docker 演示默认开发模式（日志打印验证码）；配了真实 AK 且置 false 才走阿里云
devMode = true

[logConfig]
logPath = "./logs/gochat.log"

[kafkaConfig]
# docker 部署默认走 Kafka：消息投递与跨实例推送广播都过 broker
# （宿主机工具连 localhost:29092，见 docker-compose.yml kafka 双监听器）
messageMode = "kafka"
hostPort = "kafka:9092"
loginTopic = "login"
chatTopic = "chat_message"
pushTopic = "chat_push"
logoutTopic = "logout"
partition = 1
timeout = 1
requiredAcks = "one"

[staticSrcConfig]
staticAvatarPath = "./static/avatars"
staticFilePath = "./static/files"
