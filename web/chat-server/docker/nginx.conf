server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 入口 HTML 禁缓存:hash 静态资源可长缓存,但 index.html 必须每次回源校验,
    # 否则前端发版后老用户会一直加载旧 bundle(直到启发式缓存过期)。
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # 带 hash 的静态资源内容不可变,放心长缓存
    location /js/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
